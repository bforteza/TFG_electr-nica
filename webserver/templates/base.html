<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Armario de Llaves{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .sidebar { min-height: 100vh; background: #1e2a3a; }
    .sidebar .nav-link { color: #adb5bd; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.1); border-radius: .375rem; }
    .sidebar .brand { color: #fff; font-weight: 700; font-size: 1.1rem; }
  </style>
</head>
<body>
<div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar d-flex flex-column p-3" style="width:220px; min-width:220px;">
    <a class="brand mb-4 text-decoration-none" href="/">
      <i class="bi bi-lock me-2"></i>Armario de Llaves
    </a>
    <ul class="nav flex-column gap-1">
      <li class="nav-item">
        <a class="nav-link {% if request.endpoint and 'users' in request.endpoint %}active{% endif %}"
           href="{{ url_for('users_list') }}">
          <i class="bi bi-people me-2"></i>Usuarios
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.endpoint and 'keys' in request.endpoint %}active{% endif %}"
           href="{{ url_for('keys_list') }}">
          <i class="bi bi-key me-2"></i>Llaves
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.endpoint and 'history' in request.endpoint %}active{% endif %}"
           href="{{ url_for('history_list') }}">
          <i class="bi bi-clock-history me-2"></i>Historial
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main -->
  <main class="flex-grow-1 p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
