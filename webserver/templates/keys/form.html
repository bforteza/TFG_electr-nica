{% extends "base.html" %}
{% block title %}{{ 'Editar' if action == 'edit' else 'Nueva' }} llave — Armario de Llaves{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('keys_list') }}" class="text-decoration-none text-muted">
    <i class="bi bi-arrow-left me-1"></i>Volver a llaves
  </a>
</div>

<div class="card shadow-sm" style="max-width:620px;">
  <div class="card-header">
    <h5 class="mb-0">{{ 'Editar llave' if action == 'edit' else 'Nueva llave' }}</h5>
  </div>
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Nombre <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control"
                 value="{{ key.name_ if key else '' }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Ubicación física</label>
          <input type="text" name="ubi" class="form-control"
                 value="{{ key.ubi_ if key else '' }}" placeholder="p.ej. Sala de servidores">
        </div>

        <div class="col-md-6">
          <label class="form-label">Posición en armario</label>
          <select name="pos" class="form-select">
            <option value="">— Sin asignar —</option>
            {% for p in ALL_POSITIONS %}
              {% set p_int = loop.index0 %}
              <option value="{{ p }}"
                {% if key and pos_to_string(key.pos_) == p %}selected{% endif %}
                {% if p_int in taken_pos %}disabled{% endif %}>
                {{ p }}{% if p_int in taken_pos %} (ocupado){% endif %}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12">
          <label class="form-label">Comentario</label>
          <textarea name="commentary" class="form-control" rows="2">{{ key.commentary_ if key else '' }}</textarea>
        </div>

        <div class="col-md-6">
          <label class="form-label">UID NFC <small class="text-muted">(opcional)</small></label>
          <input type="text" name="uid" class="form-control"
                 value="{{ key.uid_ if key else '' }}" placeholder="p.ej. A3F2C1B0">
        </div>

        <div class="col-md-6 d-flex align-items-end">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="active" id="active"
                   {% if not key or key.active_ %}checked{% endif %}>
            <label class="form-check-label" for="active">Llave activa</label>
          </div>
        </div>

        <div class="col-12">
          <label class="form-label">Usuarios autorizados</label>
          <select name="authorized" class="form-select" multiple size="6">
            {% for p in persons %}
              <option value="{{ p.id_ }}"
                {% if p.id_ in authorized_ids %}selected{% endif %}>
                {{ p.name_ }}
              </option>
            {% endfor %}
          </select>
          <div class="form-text">Ctrl+clic para selección múltiple.</div>
        </div>

        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            {{ 'Guardar cambios' if action == 'edit' else 'Crear llave' }}
          </button>
          <a href="{{ url_for('keys_list') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
